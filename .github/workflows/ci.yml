name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Check code formatting
        run: ruff format --check .

      - name: Lint codebase
        run: ruff check .

  test:
    name: Unit Tests (Decoupled)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install base test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov fastapi uvicorn numpy matplotlib httpx python-multipart

      - name: Run unit tests
        env:
          RAPTOR_APP_DIR: ${{ github.workspace }}
        run: |
          pytest -m "not docker and not gpu" -v --cov=core --cov=webapp
