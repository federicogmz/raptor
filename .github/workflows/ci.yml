name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest
    runs-on: ubuntu-latest

    # La suite NO corre en un runner limpio con `pip install -r requirements.txt`:
    # 14 archivos de tests importan `osgeo` (GDAL) sin guardas, y GDAL no está en
    # requirements.txt porque en producción lo hereda de la imagen base de ODM
    # (ver scripts/check_deps.py). Acá se reconstruye ese entorno desde
    # conda-forge, que es donde vive GDAL de forma instalable.
    #
    # numpy queda fijado en 1.26.4 por el mismo motivo que en requirements.txt:
    # el _gdal_array.so de ODM está compilado contra la ABI de NumPy 1.x.
    #
    # Esto cubre los tests que pasan en el host (~579/587, ver
    # docs/REVIEW_PIPELINE.md). Los que exigen el layout del contenedor (`/app`)
    # solo corren con `make test` adentro de la imagen construida.
    steps:
      - uses: actions/checkout@v7

      - name: Entorno geoespacial desde conda-forge
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: raptor
          cache-environment: true
          create-args: >-
            python=3.11
            gdal
            numpy=1.26.4
            scipy
            pyproj
            matplotlib

      - name: Dependencias propias de RAPTOR
        shell: bash -elo pipefail {0}
        run: python3 -m pip install -r requirements.txt

      - name: Verificar dependencias heredadas de la imagen base
        shell: bash -elo pipefail {0}
        run: python3 scripts/check_deps.py

      - name: Tests
        shell: bash -elo pipefail {0}
        run: python3 -m pytest tests/ -q -rf
