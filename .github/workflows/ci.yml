name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Check code formatting
        run: ruff format --check .

      - name: Lint codebase
        run: ruff check .

  test:
    name: Unit Tests (Decoupled)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies (GDAL)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gdal-bin proj-data python3-gdal python3-pyproj python3-numpy python3-scipy python3-pil \
            python3-venv python3-pip

      - name: Set up virtual environment with system site packages
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install --no-cache-dir -r requirements.txt pytest-cov
          .venv/bin/python3 -c "import numpy, pyproj; from osgeo import gdal, gdal_array; print('GDAL:', gdal.__version__, 'NumPy:', numpy.__version__, 'pyproj:', pyproj.__version__)"

      - name: Run unit tests
        env:
          RAPTOR_APP_DIR: ${{ github.workspace }}
        run: |
          .venv/bin/pytest -v --cov=core --cov=webapp
